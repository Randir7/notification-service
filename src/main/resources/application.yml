# ============================================================================
# КОНФИГУРАЦИЯ NOTIFICATION-SERVICE
# ============================================================================

server:
  # Порт 8081, а не 8080: два Spring Boot приложения на одной машине
  # не могут занять один порт. user-service слушает 8080,
  # notification-service — 8081.
  port: 8081

spring:
  application:
    # Имя приложения. Используется в логах, в Actuator, в метриках
    # и в клиентских идентификаторах Kafka. Упрощает понимание,
    # какой именно сервис написал строку лога.
    name: notification-service

  # ----------------------------------------------------------------------------
  # KAFKA (консьюмер)
  # ----------------------------------------------------------------------------
  kafka:
    # Точка входа брокера, та же, что использует user-service.
    bootstrap-servers: localhost:9092

    consumer:
      # -----------------------------------------------------------------------
      # ГРУППА КОНСЬЮМЕРОВ — важнейшее понятие потребления Kafka.
      #
      # Kafka хранит для каждой группы консьюмеров собственную позицию
      # чтения (offset) по каждой партиции топика. Группа — это как
      # подписка на газету: у каждого подписчика своя закладка,
      # и доставка продолжается с того места, где подписчик остановился.
      #
      # Следствия:
      # - Два ЗАПУСКА одного сервиса с одинаковым group-id делят сообщения
      #   между собой (каждое сообщение читается группой ровно один раз).
      # - Другая группа (другой сервис) читает те же сообщения НЕЗАВИСИМО,
      #   с собственной позиции: добавление нового сервиса-подписчика
      #   не влияет на существующих.
      #
      # Имя группы принято выбирать по имени сервиса-потребителя.
      # -----------------------------------------------------------------------
      group-id: notification-service

      # -----------------------------------------------------------------------
      # С какой позиции начинать чтение НОВОЙ группе (без сохранённого offset).
      #
      # earliest — с самого начала топика: будут прочитаны все сообщения,
      #            когда-либо записанные. Удобно в разработке: сервис,
      #            запущенный позже продюсера, всё равно увидит историю.
      # latest   — только сообщения, записанные после старта консьюмера
      #            (значение по умолчанию). История игнорируется.
      #
      # Осторожно: свойство влияет только на ПЕРВЫЙ старт группы.
      # После первого коммита offset позиция хранится в Kafka,
      # и auto-offset-reset больше не применяется.
      # -----------------------------------------------------------------------
      auto-offset-reset: earliest

      # Десериализаторы, зеркальные сериализаторам продюсера в user-service:
      # ключ и значение приходят как строки (JSON разбирается вручную).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Коммит offset'ов: по умолчанию включён автоматический режим
      # (enable-auto-commit: true) — позиция периодически сохраняется
      # фоном. Это даёт семантику at-least-once: при сбое сообщение может
      # быть обработано повторно.

  # ----------------------------------------------------------------------------
  # ПОЧТА (SMTP)
  # ----------------------------------------------------------------------------
  mail:
    # Хост и порт SMTP-сервера. В разработке это Mailpit из docker-compose:
    # он принимает письма и складывает их в веб-интерфейс на :8025,
    # не отправляя ничего в интернет.
    host: localhost
    port: 1025

    # Mailpit по умолчанию не требует аутентификации и шифрования,
    # поэтому обе возможности SMTP явно выключены.
    # В production здесь появятся реальный хост, порт 465/587,
    # auth: true и starttls: true с учётными данными из секретов окружения.
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ----------------------------------------------------------------------------
# СОБСТВЕННЫЕ СВОЙСТВА ПРИЛОЖЕНИЯ (префикс app)
# ----------------------------------------------------------------------------
app:
  kafka:
    # Имена топиков-источников. Зеркальны свойствам user-service:
    # оба сервиса должны сходиться в именах контракта.
    topic-user-created: user-created
    topic-user-deleted: user-deleted

  notification:
    # Название сайта для текста письма о создании аккаунта.
    # Вынесено в конфигурацию: тексты писем не перекомпилируются
    # при ребрендинге.
    site-name: My Super Site

    # Адрес отправителя (заголовок From письма).
    # Mailpit принимает любой адрес, включая несуществующие домены.
    from: no-reply@my-super-site.local

# ----------------------------------------------------------------------------
# ЛОГИРОВАНИЕ
# ----------------------------------------------------------------------------
logging:
  level:
    com.github.randir7.notificationservice: DEBUG
    # Логи Kafka-консьюмера полезны при отладке потребления:
    # видны присоединение к группе, назначенные партиции, коммиты offset.
    org.springframework.kafka: INFO